[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fleet-guard"
version = "0.1.0"
description = "Machine-resource guard layer for fleets of coding-agent sessions: background-process quotas, stall watchdog, leak reaping, disk guard."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "hao li", email = "haoli5933@gmail.com" }]
keywords = ["claude-code", "agents", "devops", "process-management", "watchdog"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: System :: Monitoring",
]

[project.urls]
Homepage = "https://github.com/hahahahahahahahah6/fleet-guard"
Repository = "https://github.com/hahahahahahahahah6/fleet-guard"

[project.scripts]
fleet-guard = "fleet_guard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
